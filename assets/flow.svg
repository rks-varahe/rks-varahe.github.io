<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" fill="none">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/><stop offset=".5" stop-color="#0ea5e9"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="fgBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ecfeff"/><stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#fgBg)" rx="20"/>
  <!-- dashed flow line -->
  <path d="M80 140 C 240 60, 360 220, 520 140 S 800 60, 1120 140" stroke="url(#fg)" stroke-width="2.5" stroke-dasharray="6 8" fill="none"/>
  <!-- 5 phases -->
  <g font-family="Space Grotesk, sans-serif">
    <!-- seed -->
    <g transform="translate(80,140)">
      <circle r="34" fill="#fff" stroke="#06b6d4" stroke-width="2"/>
      <path d="M -10 6 C -10 -8, 10 -8, 10 6 Z" fill="#14b8a6"/>
      <text y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">PHASE 1</text>
      <text y="80" text-anchor="middle" font-size="11" fill="#587184">Foundation</text>
    </g>
    <!-- sprout -->
    <g transform="translate(340,140)">
      <circle r="34" fill="#fff" stroke="#06b6d4" stroke-width="2"/>
      <path d="M0 12 L0 -6 M0 -6 C -8 -10 -10 -2 -2 -2 M0 -6 C 8 -10 10 -2 2 -2" stroke="#14b8a6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">PHASE 2</text>
      <text y="80" text-anchor="middle" font-size="11" fill="#587184">Acceleration</text>
    </g>
    <!-- tree -->
    <g transform="translate(600,140)">
      <circle r="34" fill="#fff" stroke="#06b6d4" stroke-width="2"/>
      <circle cx="0" cy="-4" r="12" fill="#14b8a6"/><circle cx="-8" cy="2" r="9" fill="#0ea5e9"/><circle cx="8" cy="2" r="9" fill="#06b6d4"/>
      <rect x="-2" y="6" width="4" height="10" fill="#0e7490"/>
      <text y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">PHASE 3</text>
      <text y="80" text-anchor="middle" font-size="11" fill="#587184">Peak Campaign</text>
    </g>
    <!-- storm/lightning -->
    <g transform="translate(860,140)">
      <circle r="34" fill="#fff" stroke="#06b6d4" stroke-width="2"/>
      <path d="M2 -14 L -6 4 L 0 4 L -4 16 L 8 -4 L 2 -4 Z" fill="#0ea5e9"/>
      <text y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">PHASE 4</text>
      <text y="80" text-anchor="middle" font-size="11" fill="#587184">Conversion</text>
    </g>
    <!-- check -->
    <g transform="translate(1120,140)">
      <circle r="34" fill="#fff" stroke="#06b6d4" stroke-width="2"/>
      <path d="M-10 0 L -2 8 L 12 -8" stroke="#14b8a6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">PHASE 5</text>
      <text y="80" text-anchor="middle" font-size="11" fill="#587184">Cool Down</text>
    </g>
  </g>
  <!-- floating shapes -->
  <g opacity=".4">
    <circle cx="200" cy="50" r="5" fill="#22d3ee"/>
    <rect x="450" y="30" width="10" height="10" rx="2" fill="#14b8a6" transform="rotate(20 455 35)"/>
    <polygon points="720,40 728,52 712,52" fill="#0ea5e9"/>
    <circle cx="980" cy="240" r="5" fill="#06b6d4"/>
    <rect x="200" y="230" width="8" height="8" rx="2" fill="#14b8a6"/>
  </g>
</svg>
