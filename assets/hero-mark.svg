<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="hg1" cx=".5" cy=".5" r=".55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#06b6d4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- glow -->
  <circle cx="300" cy="300" r="280" fill="url(#hg1)"/>
  <!-- orbits -->
  <g stroke="#22d3ee" stroke-opacity=".35" fill="none" stroke-dasharray="2 6">
    <ellipse cx="300" cy="300" rx="240" ry="180" transform="rotate(-12 300 300)"/>
    <ellipse cx="300" cy="300" rx="200" ry="240" transform="rotate(28 300 300)"/>
    <circle cx="300" cy="300" r="170"/>
  </g>
  <!-- core hub -->
  <circle cx="300" cy="300" r="60" fill="url(#hg2)" filter="url(#glow)"/>
  <circle cx="300" cy="300" r="60" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
  <text x="300" y="306" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="14" fill="#fff" letter-spacing="2">COMMS</text>
  <!-- spokes / nodes -->
  <g font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600" fill="#0e7490">
    <g><line x1="300" y1="300" x2="100" y2="160" stroke="#06b6d4" stroke-opacity=".5"/><circle cx="100" cy="160" r="22" fill="#fff" stroke="#06b6d4" stroke-width="2"/><text x="100" y="164" text-anchor="middle">ARC</text></g>
    <g><line x1="300" y1="300" x2="500" y2="160" stroke="#06b6d4" stroke-opacity=".5"/><circle cx="500" cy="160" r="22" fill="#fff" stroke="#06b6d4" stroke-width="2"/><text x="500" y="164" text-anchor="middle">SMCC</text></g>
    <g><line x1="300" y1="300" x2="80" y2="320" stroke="#06b6d4" stroke-opacity=".5"/><circle cx="80" cy="320" r="22" fill="#fff" stroke="#06b6d4" stroke-width="2"/><text x="80" y="324" text-anchor="middle">QRT</text></g>
    <g><line x1="300" y1="300" x2="520" y2="320" stroke="#06b6d4" stroke-opacity=".5"/><circle cx="520" cy="320" r="22" fill="#fff" stroke="#06b6d4" stroke-width="2"/><text x="520" y="324" text-anchor="middle">Growth</text></g>
    <g><line x1="300" y1="300" x2="180" y2="500" stroke="#06b6d4" stroke-opacity=".5"/><circle cx="180" cy="500" r="22" fill="#fff" stroke="#06b6d4" stroke-width="2"/><text x="180" y="504" text-anchor="middle">RN</text></g>
    <g><line x1="300" y1="300" x2="420" y2="500" stroke="#06b6d4" stroke-opacity=".5"/><circle cx="420" cy="500" r="22" fill="#fff" stroke="#06b6d4" stroke-width="2"/><text x="420" y="504" text-anchor="middle">Media</text></g>
    <g><line x1="300" y1="300" x2="300" y2="80" stroke="#06b6d4" stroke-opacity=".5"/><circle cx="300" cy="80" r="22" fill="#fff" stroke="#06b6d4" stroke-width="2"/><text x="300" y="84" text-anchor="middle">Party</text></g>
    <g><line x1="300" y1="300" x2="300" y2="540" stroke="#06b6d4" stroke-opacity=".5"/><circle cx="300" cy="540" r="22" fill="#fff" stroke="#06b6d4" stroke-width="2"/><text x="300" y="544" text-anchor="middle">Legal</text></g>
  </g>
  <!-- floating shapes -->
  <g opacity=".5">
    <polygon points="60,60 80,90 40,90" fill="#14b8a6"/>
    <rect x="520" y="60" width="22" height="22" rx="4" fill="#0ea5e9" transform="rotate(20 531 71)"/>
    <circle cx="60" cy="520" r="10" fill="#22d3ee"/>
    <polygon points="540,520 560,540 540,560 520,540" fill="#06b6d4"/>
  </g>
</svg>
