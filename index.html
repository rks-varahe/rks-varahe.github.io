<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.png" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:Poppins,system-ui,sans-serif;min-height:100vh;background:linear-gradient(135deg,#0b1726 0%,#10243a 45%,#155e75 100%);color:#e6f1f7;-webkit-font-smoothing:antialiased}
  .wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;z-index:0;pointer-events:none}
  .blob.a{width:560px;height:560px;background:#06b6d4;top:-180px;right:-140px;animation:f 14s ease-in-out infinite}
  .blob.b{width:480px;height:480px;background:#14b8a6;bottom:-160px;left:-140px;animation:f 18s ease-in-out infinite reverse}
  @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(40px)}}
  .card{position:relative;z-index:1;max-width:520px;width:100%;text-align:center;animation:in .6s ease}
  @keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .card img{height:54px;margin-bottom:32px;filter:brightness(0) invert(1);opacity:.95}
  .badge{display:inline-block;margin-bottom:18px;padding:6px 14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#22d3ee;font-weight:700}
  h1{font-size:clamp(2rem,5vw,3rem);font-weight:600;margin:0 0 14px;letter-spacing:-.02em;line-height:1.1;background:linear-gradient(135deg,#67e8f9 0%,#a7f3d0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-size:1.05rem;line-height:1.55;color:#a7d8e6;margin:0 0 28px;max-width:420px;margin-left:auto;margin-right:auto}
  .dots{display:inline-flex;gap:6px;align-items:center}
  .dots span{width:8px;height:8px;border-radius:999px;background:#22d3ee;animation:p 1.4s ease-in-out infinite}
  .dots span:nth-child(2){animation-delay:.15s}
  .dots span:nth-child(3){animation-delay:.3s}
  @keyframes p{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
  .foot{margin-top:42px;font-size:.78rem;color:#92aabd;letter-spacing:.04em}
</style>
</head>
<body>
<div class="wrap">
  <span class="blob a"></span>
  <span class="blob b"></span>
  <div class="card">
    <img src="assets/logo.png" alt="Varahe Analytics" />
    <span class="badge">Stay tuned</span>
    <h1>Something is on the way</h1>
    <p>This page is being prepared. Check back soon.</p>
    <div class="dots"><span></span><span></span><span></span></div>
    <p class="foot">© Varahe Analytics</p>
  </div>
</div>
</body>
</html>
